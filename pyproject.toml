[project]
name = "indian-market-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vardhin", email = "gamidisurya.vardhin2022@vitstudent.ac.in" }
]
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "requests>=2.32.0",
    "openpyxl>=3.1.5",
    "scikit-learn>=1.6.0",
    "fastapi>=0.118.0",
    "uvicorn[standard]>=0.37.0",
    "joblib>=1.5.0",
]

[project.optional-dependencies]
tournament = [
    "xgboost>=3.4.1",
    "lightgbm>=4.7.0",
    "catboost>=1.2.10",
    "shap>=0.52.0",
]
deep = [
    "torch>=2.14.1",
    "neuralforecast>=3.2.2",
]
mamba = [
    "mamba-ssm>=2.3.2.post1",
]

[project.scripts]
indian-market-lab = "indian_market_lab:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
